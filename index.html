<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- displays site properly based on user's device -->
    <link rel="icon" type="image/png" sizes="32x32"
      href="./images/favicon-32x32.png">
    <title>Frontend Mentor | Product preview card component</title>
  </head>
  <body>
    <main class="content">
      <article class="porduct-card">
        <div class="product-card__image-wrapper">
          <picture>
            <source
              media="(min-width: 768px)"
              srcset="./images/image-product-desktop.jpg"
              width="600"
              hight="900">
            <img
              class="product-card__image"
              src="./images/image-product-mobile.jpg"
              alt="Perfume"
              width="700"
              height="684">
          </picture>
        </div>
        <div class="product-card__body">
          <span class="tag text-4">Perfume</span>
          <h1 class="product-card__title text-1">Gabrielle Essence Eau De
            Parfum</h1>
          <p class="product-card__description text-3">A floral, solar and
            voluptuous
            interpretation composed by Olivier Polge, Perfumer-Creator for the
            House of CHANEL.</p>
          <div class="product-card__prices">
            <span class="product-card__price text-1">$149.99</span>
            <span class="product-card__prev-price text-5">$169.99</span>
          </div>
          <button
            class="product-card__button text-2"
            type="button">
            <img
              class="product-card__button-icon"
              src="./images/icon-cart.svg"
              alt="Cart"
              width="18"
              height="18">
            Add to Cart
          </button>
        </div>
      </article>
    </main>
  </body>
</html>
